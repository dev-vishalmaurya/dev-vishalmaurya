<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 42px; letter-spacing: 2px; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #94A3B8; letter-spacing: 0.5px; }
    .tag-text { font-family: 'Fira Code', monospace, sans-serif; font-weight: 600; font-size: 11px; fill: #E2E8F0; }
    .status-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #10B981; letter-spacing: 0.8px; }
    .term-prompt { font-family: 'Fira Code', monospace; font-size: 13px; fill: #38BDF8; }
    .term-cmd { font-family: 'Fira Code', monospace; font-size: 13px; fill: #CBD5E1; }
  </style>

  <!-- Canvas Outer Background -->
  <rect width="850" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="80" r="110" fill="#0284C7" opacity="0.18" filter="url(#glow)" />
  <circle cx="700" cy="220" r="120" fill="#7C3AED" opacity="0.15" filter="url(#glow)" />

  <!-- Subtle Tech Grid Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40" />
    <line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="160" x2="850" y2="160" />
    <line x1="0" y1="200" x2="850" y2="200" />
    <line x1="0" y1="240" x2="850" y2="240" />
    <line x1="0" y1="280" x2="850" y2="280" />
    <line x1="70" y1="0" x2="70" y2="320" />
    <line x1="140" y1="0" x2="140" y2="320" />
    <line x1="210" y1="0" x2="210" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="420" y1="0" x2="420" y2="320" />
    <line x1="490" y1="0" x2="490" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="630" y1="0" x2="630" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="770" y1="0" x2="770" y2="320" />
  </g>

  <!-- Inner Glass Card Container -->
  <rect x="20" y="20" width="810" height="280" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

  <!-- Window Header Bar -->
  <rect x="20" y="20" width="810" height="42" rx="14" fill="#0F172A" fill-opacity="0.6" />
  <circle cx="44" cy="41" r="5.5" fill="#EF4444" />
  <circle cx="62" cy="41" r="5.5" fill="#F59E0B" />
  <circle cx="80" cy="41" r="5.5" fill="#10B981" />

  <!-- Top Right Availability Pill -->
  <rect x="535" y="30" width="275" height="23" rx="11.5" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
  <circle cx="550" cy="41.5" r="4" fill="#10B981" />
  <text x="562" y="45.5" class="status-text">AVAILABLE FOR SENIOR ARCHITECTURE ROLES</text>

  <!-- Main Hero Title -->
  <text x="44" y="112" class="title" fill="url(#textGrad)">VISHAL MAURYA</text>

  <!-- Subtitle -->
  <text x="44" y="142" class="subtitle">Senior Full Stack Software Engineer • Enterprise Systems Architect</text>

  <!-- Sleek Accent Gradient Line -->
  <rect x="44" y="162" width="762" height="2" fill="url(#accentLine)" rx="1" />

  <!-- Tech Pills Row -->
  <g transform="translate(44, 180)">
    <!-- Pill 1: ASP.NET Core -->
    <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#pillBg)" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" class="tag-text">⚡ ASP.NET Core</text>

    <!-- Pill 2: C# & .NET 9 -->
    <rect x="140" y="0" width="112" height="28" rx="6" fill="url(#pillBg)" stroke="#475569" stroke-width="1" />
    <text x="154" y="18" class="tag-text">🔷 C# / .NET 9</text>

    <!-- Pill 3: Angular & React -->
    <rect x="262" y="0" width="150" height="28" rx="6" fill="url(#pillBg)" stroke="#475569" stroke-width="1" />
    <text x="276" y="18" class="tag-text">⚛️ Angular • React</text>

    <!-- Pill 4: SQL & Postgres -->
    <rect x="422" y="0" width="168" height="28" rx="6" fill="url(#pillBg)" stroke="#475569" stroke-width="1" />
    <text x="436" y="18" class="tag-text">🗄️ SQL Server • Postgres</text>

    <!-- Pill 5: Clean Arch -->
    <rect x="600" y="0" width="162" height="28" rx="6" fill="url(#pillBg)" stroke="#475569" stroke-width="1" />
    <text x="614" y="18" class="tag-text">🏛️ Clean Architecture</text>
  </g>

  <!-- Bottom Terminal Style Footnote -->
  <rect x="44" y="228" width="762" height="48" rx="8" fill="#020617" fill-opacity="0.6" stroke="#1E293B" stroke-width="1" />
  <text x="62" y="258" class="term-prompt">dev-vishalmaurya:~$</text>
  <text x="235" y="258" class="term-cmd">architect --domain "Healthcare | E-Learning | FinTech" --resilient --scale-ready</text>
</svg>
