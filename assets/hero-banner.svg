<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409" />
      <stop offset="40%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#04080F" />
    </linearGradient>

    <!-- Glass card -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01" />
    </linearGradient>

    <!-- Hero name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="35%" stop-color="#A78BFA" />
      <stop offset="65%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glow blue left -->
    <radialGradient id="glowL" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <!-- Glow purple right -->
    <radialGradient id="glowR" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Glow pink center -->
    <radialGradient id="glowC" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent top line -->
    <linearGradient id="accentTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="1" />
      <stop offset="80%" stop-color="#F472B6" stop-opacity="1" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0" />
    </linearGradient>

    <!-- Terminal bg -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#010409" />
      <stop offset="100%" stop-color="#06091A" />
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" mode="overlay" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>

    <!-- Border gradient for card -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.2" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="18" y="18" width="864" height="304" rx="16" />
    </clipPath>
  </defs>

  <style>
    .name    { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; font-size: 46px; letter-spacing: 3px; }
    .sub     { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 15.5px; fill: #94A3B8; letter-spacing: 0.6px; }
    .pill    { font-family: 'Fira Code', 'Courier New', monospace; font-weight: 600; font-size: 11.5px; fill: #CBD5E1; }
    .status  { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 10.5px; fill: #34D399; letter-spacing: 1px; }
    .prompt  { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #38BDF8; }
    .cmd     { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #94A3B8; }
    .cursor  { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #A78BFA; }
    .wintab  { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 11px; fill: #475569; }
    .wintab-a{ font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #E2E8F0; }
  </style>

  <!-- ░░ OUTER BACKGROUND ░░ -->
  <rect width="900" height="340" fill="url(#bg)" rx="18" />

  <!-- ░░ AMBIENT GLOW ORBS ░░ -->
  <ellipse cx="140" cy="100" rx="200" ry="150" fill="url(#glowL)" filter="url(#softGlow)" />
  <ellipse cx="750" cy="240" rx="220" ry="160" fill="url(#glowR)" filter="url(#softGlow)" />
  <ellipse cx="450" cy="170" rx="250" ry="180" fill="url(#glowC)" filter="url(#softGlow)" />

  <!-- ░░ MICRO STAR FIELD ░░ -->
  <g opacity="0.55">
    <circle cx="55"  cy="28"  r="1"   fill="#E2E8F0" opacity="0.6"/>
    <circle cx="122" cy="55"  r="0.8" fill="#BAE6FD" opacity="0.5"/>
    <circle cx="198" cy="18"  r="1.2" fill="#E2E8F0" opacity="0.4"/>
    <circle cx="310" cy="44"  r="0.7" fill="#DDD6FE" opacity="0.6"/>
    <circle cx="415" cy="22"  r="1"   fill="#FBCFE8" opacity="0.5"/>
    <circle cx="530" cy="38"  r="0.9" fill="#BAE6FD" opacity="0.4"/>
    <circle cx="642" cy="16"  r="1.1" fill="#E2E8F0" opacity="0.5"/>
    <circle cx="750" cy="42"  r="0.8" fill="#DDD6FE" opacity="0.6"/>
    <circle cx="842" cy="28"  r="1"   fill="#E2E8F0" opacity="0.4"/>
    <circle cx="880" cy="60"  r="0.7" fill="#BAE6FD" opacity="0.5"/>
    <circle cx="72"  cy="300" r="0.9" fill="#E2E8F0" opacity="0.3"/>
    <circle cx="190" cy="315" r="1"   fill="#BAE6FD" opacity="0.35"/>
    <circle cx="360" cy="322" r="0.8" fill="#DDD6FE" opacity="0.4"/>
    <circle cx="820" cy="295" r="1.1" fill="#FBCFE8" opacity="0.35"/>
  </g>

  <!-- ░░ SUBTLE DOT GRID ░░ -->
  <g opacity="0.045" fill="#94A3B8">
    <circle cx="90"  cy="90"  r="1.2"/><circle cx="180" cy="90"  r="1.2"/>
    <circle cx="270" cy="90"  r="1.2"/><circle cx="360" cy="90"  r="1.2"/>
    <circle cx="450" cy="90"  r="1.2"/><circle cx="540" cy="90"  r="1.2"/>
    <circle cx="630" cy="90"  r="1.2"/><circle cx="720" cy="90"  r="1.2"/>
    <circle cx="810" cy="90"  r="1.2"/>
    <circle cx="90"  cy="170" r="1.2"/><circle cx="180" cy="170" r="1.2"/>
    <circle cx="270" cy="170" r="1.2"/><circle cx="360" cy="170" r="1.2"/>
    <circle cx="450" cy="170" r="1.2"/><circle cx="540" cy="170" r="1.2"/>
    <circle cx="630" cy="170" r="1.2"/><circle cx="720" cy="170" r="1.2"/>
    <circle cx="810" cy="170" r="1.2"/>
    <circle cx="90"  cy="250" r="1.2"/><circle cx="180" cy="250" r="1.2"/>
    <circle cx="270" cy="250" r="1.2"/><circle cx="360" cy="250" r="1.2"/>
    <circle cx="450" cy="250" r="1.2"/><circle cx="540" cy="250" r="1.2"/>
    <circle cx="630" cy="250" r="1.2"/><circle cx="720" cy="250" r="1.2"/>
    <circle cx="810" cy="250" r="1.2"/>
  </g>

  <!-- ░░ GLASS CARD ░░ -->
  <rect x="18" y="18" width="864" height="304" rx="16" fill="url(#glass)" />
  <rect x="18" y="18" width="864" height="304" rx="16" fill="none" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- ░░ TOP ACCENT SHIMMER LINE ░░ -->
  <rect x="80" y="18" width="740" height="1.5" rx="1" fill="url(#accentTop)" opacity="0.9" />

  <!-- ░░ WINDOW CHROME BAR ░░ -->
  <rect x="18" y="18" width="864" height="46" rx="16" fill="#0A0E1A" fill-opacity="0.7" />
  <rect x="18" y="48" width="864" height="16" fill="#0A0E1A" fill-opacity="0.7" />

  <!-- Traffic lights -->
  <circle cx="44"  cy="42" r="6" fill="#FF5F57" />
  <circle cx="44"  cy="42" r="3" fill="#FF1E00" fill-opacity="0.3"/>
  <circle cx="64"  cy="42" r="6" fill="#FFBD2E" />
  <circle cx="64"  cy="42" r="3" fill="#FF8C00" fill-opacity="0.3"/>
  <circle cx="84"  cy="42" r="6" fill="#28C840" />
  <circle cx="84"  cy="42" r="3" fill="#008000" fill-opacity="0.3"/>

  <!-- Window tabs -->
  <rect x="104" y="30" width="140" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#2D3F57" stroke-width="1"/>
  <text x="120" y="46" class="wintab-a">profile.md</text>

  <rect x="252" y="30" width="116" height="24" rx="6" fill="transparent" />
  <text x="268" y="46" class="wintab">README.md</text>

  <!-- Status pill -->
  <rect x="560" y="30" width="302" height="24" rx="12" fill="#022C22" fill-opacity="0.7" stroke="#059669" stroke-opacity="0.6" stroke-width="1" />
  <circle cx="578" cy="42" r="4.5" fill="#10B981" />
  <circle cx="578" cy="42" r="2.5" fill="#34D399" />
  <text x="592" y="46" class="status">AVAILABLE FOR SENIOR ARCHITECTURE ROLES</text>

  <!-- ░░ HERO TITLE ░░ -->
  <text x="46" y="116" class="name" fill="url(#nameGrad)" filter="url(#textGlow)">VISHAL MAURYA</text>

  <!-- Subtitle -->
  <text x="48" y="144" class="sub">Senior Full Stack Engineer  •  Enterprise Systems Architect  •  Cloud Solutions</text>

  <!-- Divider line -->
  <rect x="46" y="160" width="808" height="1.5" rx="1" fill="url(#accentTop)" opacity="0.5" />

  <!-- ░░ TECH PILLS ROW ░░ -->
  <g transform="translate(46, 178)">
    <!-- Pill 1 -->
    <rect x="0"   y="0" width="138" height="30" rx="8" fill="url(#pillGrad)" stroke="#2D4A6A" stroke-width="1"/>
    <text x="14"  y="20" class="pill">⚡ ASP.NET Core</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="118" height="30" rx="8" fill="url(#pillGrad)" stroke="#3D2F7A" stroke-width="1"/>
    <text x="162" y="20" class="pill">🔷 C# / .NET 9</text>

    <!-- Pill 3 -->
    <rect x="276" y="0" width="156" height="30" rx="8" fill="url(#pillGrad)" stroke="#2D4A6A" stroke-width="1"/>
    <text x="290" y="20" class="pill">⚛️ Angular • React</text>

    <!-- Pill 4 -->
    <rect x="442" y="0" width="174" height="30" rx="8" fill="url(#pillGrad)" stroke="#3D2F7A" stroke-width="1"/>
    <text x="456" y="20" class="pill">🗄️ SQL • PostgreSQL</text>

    <!-- Pill 5 -->
    <rect x="626" y="0" width="182" height="30" rx="8" fill="url(#pillGrad)" stroke="#4A2847" stroke-width="1"/>
    <text x="640" y="20" class="pill">🏛️ Clean Architecture</text>
  </g>

  <!-- ░░ TERMINAL BLOCK ░░ -->
  <rect x="46" y="228" width="808" height="72" rx="10" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.2" />
  <!-- Terminal top bar -->
  <rect x="46" y="228" width="808" height="22" rx="10" fill="#030712" />
  <rect x="46" y="238" width="808" height="12" fill="#030712" />
  <text x="64" y="244" class="wintab">Terminal — bash</text>

  <!-- Terminal line 1 -->
  <text x="64" y="274" class="prompt">▶  dev-vishalmaurya</text>
  <text x="232" y="274" class="cmd"> ~/projects</text>
  <text x="302" y="274" class="cursor">  (main)  </text>
  <text x="380" y="274" class="cmd">$ architect --domain "Healthcare | FinTech | E-Learning" --scale-ready --clean-arch</text>

  <!-- Terminal line 2 -->
  <text x="64" y="291" class="cmd" fill="#475569">  ✓ Systems online · SOLID · DDD · CQRS · Zero-Trust Security · CI/CD Ready</text>

  <!-- Bottom accent line -->
  <rect x="46" y="320" width="808" height="1" rx="1" fill="url(#accentTop)" opacity="0.3" />
</svg>
