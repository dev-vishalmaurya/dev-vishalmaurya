<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 115" width="100%" height="100%">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="valGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="valGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="valGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="valGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <style>
    .metric-val { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px; }
    .metric-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #F1F5F9; letter-spacing: 0.2px; }
    .metric-sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 11px; fill: #64748B; }
  </style>

  <!-- Container -->
  <rect x="0" y="0" width="850" height="115" rx="14" fill="url(#metricBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Column Dividers -->
  <line x1="212" y1="20" x2="212" y2="95" stroke="#1E293B" stroke-width="1.5" />
  <line x1="425" y1="20" x2="425" y2="95" stroke="#1E293B" stroke-width="1.5" />
  <line x1="637" y1="20" x2="637" y2="95" stroke="#1E293B" stroke-width="1.5" />

  <!-- Metric 1 -->
  <g transform="translate(30, 24)">
    <text x="0" y="34" class="metric-val" fill="url(#valGrad1)">3+ Yrs</text>
    <text x="0" y="58" class="metric-title">Enterprise Experience</text>
    <text x="0" y="74" class="metric-sub">Scalable Production Systems</text>
  </g>

  <!-- Metric 2 -->
  <g transform="translate(242, 24)">
    <text x="0" y="34" class="metric-val" fill="url(#valGrad2)">4 Major</text>
    <text x="0" y="58" class="metric-title">Industry Domains</text>
    <text x="0" y="74" class="metric-sub">Health, FinTech, Edu, Real Estate</text>
  </g>

  <!-- Metric 3 -->
  <g transform="translate(455, 24)">
    <text x="0" y="34" class="metric-val" fill="url(#valGrad3)">$270+</text>
    <text x="0" y="58" class="metric-title">Bounty Pipeline</text>
    <text x="0" y="74" class="metric-sub">Verified Open-Source Impact</text>
  </g>

  <!-- Metric 4 -->
  <g transform="translate(667, 24)">
    <text x="0" y="34" class="metric-val" fill="url(#valGrad4)">100%</text>
    <text x="0" y="58" class="metric-title">Clean Architecture</text>
    <text x="0" y="74" class="metric-sub">SOLID, DDD & Microservices</text>
  </g>
</svg>
